<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="dropGrad" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0369A1" flood-opacity="0.35"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)"/>

  <!-- Main Shield Body -->
  <g filter="url(#dropShadow)">
    <!-- Outer Golden Shield Rim -->
    <path d="M256 36 L436 96 C436 290 350 412 256 476 C162 412 76 290 76 96 Z" 
          fill="url(#shieldRim)" stroke="#FFFBEB" stroke-width="4" stroke-linejoin="round"/>

    <!-- Inner Deep Ocean Shield -->
    <path d="M256 52 L418 106 C418 280 340 392 256 452 C172 392 94 280 94 106 Z" 
          fill="url(#shieldGrad)"/>

    <!-- Inner Shield Shimmer -->
    <path d="M256 58 L410 110 C410 230 360 340 256 438 C256 438 256 58 256 58 Z" 
          fill="white" opacity="0.08"/>
  </g>

  <!-- High-Tech Radar Arcs -->
  <g stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" opacity="0.65" filter="url(#glowFilter)">
    <path d="M176 186 A105 105 0 0 1 336 186" stroke-dasharray="12 12"/>
    <path d="M146 226 A145 145 0 0 1 366 226" stroke-dasharray="16 14"/>
    <path d="M120 266 A185 185 0 0 1 392 266" stroke-dasharray="20 18"/>
  </g>

  <!-- Hydrodynamic Ocean Waves (The Flood Barrier) -->
  <path d="M110 330 C150 280 210 270 256 310 C300 350 360 340 402 290 C406 330 380 380 256 442 C140 380 112 330 110 330 Z" 
        fill="url(#waveGrad1)" opacity="0.95"/>

  <path d="M125 350 C170 300 220 305 256 335 C295 365 345 355 385 315 C370 365 330 405 256 446 C180 405 140 365 125 350 Z" 
        fill="url(#waveGrad2)"/>

  <path d="M132 344 C175 300 220 306 256 335 C295 365 345 352 385 315" 
        fill="none" stroke="#FFFBEB" stroke-width="4" stroke-linecap="round"/>

  <!-- Central Water Droplet Beacon -->
  <g filter="url(#glowFilter)">
    <path d="M256 120 C220 175 200 215 200 248 C200 278 225 304 256 304 C287 304 312 278 312 248 C312 215 292 175 256 120 Z" 
          fill="url(#dropGrad)"/>

    <path d="M256 142 C234 184 220 214 220 238 C220 258 236 274 256 274 C276 274 292 258 292 238 C292 214 278 184 256 142 Z" 
          fill="#FFFFFF" opacity="0.75"/>

    <circle cx="244" cy="226" r="9" fill="white"/>
    <circle cx="264" cy="248" r="4" fill="white" opacity="0.8"/>
  </g>

  <!-- Sentinel Sparkle -->
  <path d="M256 94 L260 106 L272 110 L260 114 L256 126 L252 114 L240 110 L252 106 Z" fill="#FFFBEB"/>
</svg>